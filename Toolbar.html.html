<!DOCTYPE html>
<html lang="en">
<head>
    <title>Canvas</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
        <link rel="stylesheet" href="style.css" />
</head>
    <body>
<div id="main">
    <div id="tools">
        <div id="pencil">
            <button> <span class="material-symbols-outlined">draw</span>
            </button> 
        </div>
        <div > 
            <button><span class="material-symbols-outlined">brush</span> </button>
        </div>
        <div>
            <button> <span class="material-symbols-outlined">ink_eraser</span></button>
        </div>
        <div id="line">
            <button > <span class="material-symbols-outlined">edit</span> 
            </button>
        </div>
        <!-- <div id="arrdown"> 
            <button id="shapes-btn"> <span class="material-symbols-outlined">keyboard_arrow_down</span>
            </button>
            
        </div> -->
        <span > Tools </span>
    </div>
    <div id="shapes">
        <div> <button> <span class="material-symbols-outlined">rectangle</span></button>
        </div>
        <div> <button> <span class="material-symbols-outlined">change_history</span> </button>
        </div>
        <div> <button> <span class="material-symbols-outlined">circle</span> </button>
        </div>
        <div> <button> <span class="material-symbols-outlined">square</span></button>
        </div>
        <div> <button><span class="material-symbols-outlined">hexagon</span></button>
        </div>
        <div> <button><span class="material-symbols-outlined">pentagon</span></button>
        </div>
        <div> <button><span class="material-symbols-outlined">star</span></button>
        </div>
        <div> <button><span class="material-symbols-outlined">arrow_forward</span></button>
        </div>
        <div> <button> <span class="material-symbols-outlined">arrow_downward</span></button>
        </div>
        <div> <button><span class="material-symbols-outlined">arrow_back</span></button> 
        </div>
        <div> <button><span class="material-symbols-outlined">arrow_upward</span></button>
        </div>
        <div><button><span class="material-symbols-outlined">diamond</span></button>
        </div>
        <span> Shapes </span>
    </div>
</div>
</body>
</html>
